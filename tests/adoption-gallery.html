<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>怪马领养池 · 视觉检查</title><style>body{margin:24px;background:#dfff4f;font:14px sans-serif;color:#20231c}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#fafbf3;padding:16px;border:1px solid;border-radius:8px}canvas{width:100%;height:auto}h2{margin:4px 0}p{font-size:12px}</style><h1>怪马领养池 / 12 款</h1><main></main><script src="../adoption.js"></script><script>for(const pet of ADOPTION_CATALOG){const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=600;canvas.height=300;const c=canvas.getContext('2d');c.lineWidth=4;c.lineJoin=c.lineCap='round';for(const s of adoptionDrawing(pet.id).strokes){c.beginPath();c.strokeStyle=s.c;s.p.forEach(([x,y],i)=>i?c.lineTo(x*600,y*300):c.moveTo(x*600,y*300));c.stroke()}const title=document.createElement('h2');title.textContent=pet.name;const description=document.createElement('p');description.textContent=pet.bio;card.append(canvas,title,description);document.querySelector('main').append(card)}</script></html>
